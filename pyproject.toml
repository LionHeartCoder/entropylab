[project]
name = "lotto"
version = "0.1.0"
description = "Entropy Lab: multi-source true-random lottery picker for Virginia Lottery games"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "sounddevice>=0.5",
    "httpx>=0.27",
    "cryptography>=43",
    "typer>=0.12",
    "tzdata>=2026.3",
]

[project.scripts]
lotto = "lotto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotto"]

[dependency-groups]
dev = ["pytest>=8"]
